<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autobus in tempo reale in Friuli Venezia Giulia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --urbano:#1258c8;      --urbano-scuro:#0c3f92;
  --extra:#e2680c;       --extra-scuro:#a94b06;
  --altro:#5b6470;       --altro-scuro:#3d444d;
  --inchiostro:#131c27;  --tenue:#5d6b7c;
  --carta:#ffffff;       --fondo:#eef1f5;
  --bordo:#d5dbe3;       --ombra:0 2px 10px rgba(15,28,45,.13);
  --ombra-alta:0 8px 30px rgba(15,28,45,.20);
  --raggio:12px;         --stantio:#8a94a2;
  --ok:#12805c;          --guasto:#c0392b;   --attesa:#b8770a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:15px/1.45 "Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color:var(--inchiostro); background:var(--fondo);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1258c8;outline-offset:2px;border-radius:6px}

/* ---------- barra superiore ---------- */
#barra{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:8px 12px; background:var(--carta); border-bottom:1px solid var(--bordo);
  box-shadow:var(--ombra); z-index:1200; position:relative;
}
#marchio{display:flex;align-items:center;gap:9px;min-width:0}
#marchio svg{flex:0 0 auto}
#titolo{font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sottotitolo{font-size:11.5px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spazio{flex:1 1 auto}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--fondo);border:1px solid var(--bordo);font-size:12.5px;font-weight:600;white-space:nowrap;
}
.pill b{font-size:14px}
#spia{width:9px;height:9px;border-radius:50%;background:var(--stantio);flex:0 0 auto}
#spia.ok{background:var(--ok)} #spia.attesa{background:var(--attesa)} #spia.guasto{background:var(--guasto)}
.bottone{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--bordo);
  background:var(--carta);font-size:13.5px;font-weight:600;transition:background .15s,border-color .15s;
}
.bottone:hover{background:#f4f7fb;border-color:#b9c3cf}
.bottone.primario{background:var(--urbano);border-color:var(--urbano);color:#fff}
.bottone.primario:hover{background:var(--urbano-scuro);border-color:var(--urbano-scuro)}
.bottone[aria-pressed="true"]{background:var(--urbano);border-color:var(--urbano);color:#fff}
.solo-icona{min-width:40px;padding:8px}

/* ---------- corpo ---------- */
#corpo{flex:1 1 auto;display:flex;min-height:0;position:relative}
#pannello{
  flex:0 0 302px; background:var(--carta); border-right:1px solid var(--bordo);
  display:flex; flex-direction:column; min-height:0; z-index:1100;
}
#pannello .sezione{padding:12px 14px;border-bottom:1px solid var(--bordo)}
#pannello h2{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--tenue)}
.filtri{display:flex;gap:8px}
.filtro{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;border-radius:10px;border:1.5px solid var(--bordo);background:var(--carta);
  font-size:13.5px;font-weight:600;transition:all .15s;
}
.filtro .bollo{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.filtro[data-tipo="urbano"] .bollo{background:var(--urbano)}
.filtro[data-tipo="extraurbano"] .bollo{background:var(--extra)}
.filtro[aria-pressed="true"][data-tipo="urbano"]{border-color:var(--urbano);background:#e8f0fd;color:var(--urbano-scuro)}
.filtro[aria-pressed="true"][data-tipo="extraurbano"]{border-color:var(--extra);background:#fdf0e4;color:var(--extra-scuro)}
.filtro[aria-pressed="false"]{opacity:.5}
.campo{position:relative;margin-bottom:8px}
.campo:last-child{margin-bottom:0}
.campo input{
  width:100%;min-height:42px;padding:8px 34px 8px 12px;border-radius:10px;
  border:1.5px solid var(--bordo);background:var(--carta);
}
.campo input:focus{border-color:var(--urbano);outline:none}
.pulisci{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border:0;background:transparent;border-radius:50%;
  color:var(--tenue);font-size:17px;line-height:1;display:none;
}
.campo.pieno .pulisci{display:block}
.pulisci:hover{background:var(--fondo)}
#suggerimenti{
  list-style:none;margin:6px 0 0;padding:0;max-height:190px;overflow-y:auto;
  border:1px solid var(--bordo);border-radius:10px;display:none;background:var(--carta);
}
#suggerimenti.aperto{display:block}
#suggerimenti li button{
  width:100%;text-align:left;padding:9px 11px;border:0;background:transparent;
  border-bottom:1px solid var(--fondo);font-size:13px;line-height:1.3;
}
#suggerimenti li:last-child button{border-bottom:0}
#suggerimenti li button:hover,#suggerimenti li button:focus{background:#eaf1fd}
#suggerimenti .luogo{font-weight:600}
#suggerimenti .dettaglio{color:var(--tenue);font-size:11.5px}

#elenco-zona{flex:1 1 auto;overflow-y:auto;min-height:0}
#elenco-zona .sezione{border-bottom:0}
#elenco{list-style:none;margin:0;padding:0}
#elenco li{margin-bottom:6px}
.voce{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  padding:8px 10px;border-radius:10px;border:1px solid var(--bordo);background:var(--carta);
  min-height:44px;
}
.voce:hover{background:#f4f7fb}
.voce[aria-current="true"]{border-color:var(--urbano);background:#eaf1fd}
.voce .sigla{
  flex:0 0 auto;min-width:38px;padding:3px 7px;border-radius:7px;text-align:center;
  font-weight:800;font-size:12.5px;color:#fff;letter-spacing:-.2px;
}
.voce .sigla.urbano{background:var(--urbano)} .voce .sigla.extraurbano{background:var(--extra)}
.voce .sigla.altro{background:var(--altro)}
.voce .testo{min-width:0;flex:1}
.voce .dove{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voce .quando{display:block;font-size:11.5px;color:var(--tenue);margin-top:1px}
.voce.stantia{opacity:.62}
#vuoto{padding:16px 14px;color:var(--tenue);font-size:13px;text-align:center;line-height:1.5}

/* ---------- mappa ---------- */
#mappa-zona{flex:1 1 auto;position:relative;min-width:0}
#mappa{position:absolute;inset:0;background:#dfe6ee}
#avviso{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1000;
  max-width:calc(100% - 24px);padding:9px 15px;border-radius:999px;
  background:rgba(19,28,39,.93);color:#fff;font-size:13px;font-weight:600;
  box-shadow:var(--ombra-alta);display:none;text-align:center;
}
#avviso.visibile{display:block}
#comandi-mappa{position:absolute;right:10px;bottom:26px;z-index:1000;display:flex;flex-direction:column;gap:8px}
#comandi-mappa .bottone{box-shadow:var(--ombra);background:var(--carta)}

/* ---------- puntini, bandierine, raggruppamenti ---------- */
.bandierina-guscio{background:none!important;border:0!important}
.bandierina{
  position:relative; transform:translate(-50%,-100%);
  display:inline-block; padding:2px 6px; border-radius:6px;
  font-size:11.5px; font-weight:800; letter-spacing:-.2px; line-height:1.25;
  color:#fff; white-space:nowrap; border:1.5px solid rgba(255,255,255,.92);
  box-shadow:0 1px 4px rgba(15,28,45,.42); cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.bandierina::after{                 /* asticella verso il puntino */
  content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
  width:2px; height:7px; background:inherit; border-radius:0 0 1px 1px;
  box-shadow:0 0 0 1px rgba(255,255,255,.55);
}
.bandierina.urbano{background:var(--urbano)}
.bandierina.extraurbano{background:var(--extra)}
.bandierina.altro{background:var(--altro)}
.bandierina.scelta{
  border-color:#131c27; box-shadow:0 0 0 2px #fff,0 2px 9px rgba(15,28,45,.5);
  font-size:12.5px; padding:3px 8px; z-index:5;
}
.bandierina.stantia{background:var(--stantio)}

.gruppo-guscio{background:none!important;border:0!important}
.gruppo{
  transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
  border-radius:50%; font-weight:800; color:#fff; cursor:pointer;
  border:2.5px solid rgba(255,255,255,.95); box-shadow:0 2px 8px rgba(15,28,45,.4);
  background:var(--urbano); font-variant-numeric:tabular-nums;
}
.gruppo.misto{background:linear-gradient(135deg,var(--urbano) 0 50%,var(--extra) 50% 100%)}
.gruppo.extraurbano{background:var(--extra)}
.gruppo.p{width:34px;height:34px;font-size:13px}
.gruppo.m{width:42px;height:42px;font-size:14.5px}
.gruppo.g{width:52px;height:52px;font-size:16px}

/* ---------- scheda del mezzo ---------- */
#scheda{
  position:absolute; right:10px; top:10px; z-index:1100; width:318px; max-width:calc(100% - 20px);
  background:var(--carta); border-radius:var(--raggio); box-shadow:var(--ombra-alta);
  border:1px solid var(--bordo); display:none; overflow:hidden;
}
#scheda.visibile{display:block}
#scheda .testa{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 10px;color:#fff}
#scheda .testa.urbano{background:var(--urbano)} #scheda .testa.extraurbano{background:var(--extra)}
#scheda .testa.altro{background:var(--altro)}
#scheda .linea{
  flex:0 0 auto;min-width:44px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.22);
  border:1.5px solid rgba(255,255,255,.6);font-size:17px;font-weight:800;text-align:center;
}
#scheda .verso{flex:1;min-width:0}
#scheda .verso .etichetta{font-size:11px;text-transform:uppercase;letter-spacing:.7px;opacity:.85}
#scheda .verso .valore{font-size:14.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
#chiudi-scheda{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:0;
  background:rgba(255,255,255,.2);color:#fff;font-size:18px;line-height:1;
}
#chiudi-scheda:hover{background:rgba(255,255,255,.34)}
#scheda dl{margin:0;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
#scheda dt{color:var(--tenue);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px}
#scheda dd{margin:0;font-weight:600;overflow-wrap:anywhere}
#scheda .piede{padding:10px 12px;border-top:1px solid var(--bordo);display:flex;gap:8px}
#scheda .piede .bottone{flex:1}
#nota-scheda{
  margin:0;padding:8px 12px;background:#fff8e6;border-top:1px solid #f0dfae;
  font-size:12px;color:#7a5b06;display:none;
}
#nota-scheda.visibile{display:block}

/* ---------- adattamento agli schermi piccoli ---------- */
#apri-pannello{display:none}
@media (max-width:820px){
  #barra{padding:7px 10px;gap:7px}
  #sottotitolo{display:none}
  #apri-pannello{display:inline-flex}
  #pannello{
    position:absolute; inset:0 auto 0 0; width:min(78vw,318px); flex-basis:auto;
    transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--ombra-alta);
  }
  #pannello.aperto{transform:none}
  #velo{position:absolute;inset:0;background:rgba(19,28,39,.4);z-index:1050;display:none}
  #velo.visibile{display:block}
  #scheda{
    right:0;left:0;top:auto;bottom:0;width:auto;max-width:none;
    border-radius:var(--raggio) var(--raggio) 0 0;border-bottom:0;
    max-height:58vh;display:none;flex-direction:column;
  }
  #scheda.visibile{display:flex}
  #scheda dl{overflow-y:auto;min-height:0;gap:5px 12px}
  #scheda .testa,#scheda .piede,#nota-scheda{flex:0 0 auto}
  #comandi-mappa{bottom:auto;top:10px;right:10px}
  .etichetta-lunga{display:none}
  .etichetta-breve{display:inline}
}
.etichetta-breve{display:none}
@media (min-width:821px){ #velo{display:none!important} }
@media (max-width:620px){
  /* Lo spazio va ai dati: il nome della pagina resta nella scheda del browser. */
  #marchio > div{display:none}
  .pill{padding:4px 9px;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
.solo-lettori{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:10.5px}
</style>
</head>
<body>

<header id="barra">
  <button id="apri-pannello" class="bottone solo-icona" aria-label="Apri filtri e ricerca" aria-expanded="false" aria-controls="pannello">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div id="marchio">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3.5" y="3" width="17" height="14.5" rx="3" fill="#1258c8"/>
      <rect x="5.6" y="5.4" width="12.8" height="5.2" rx="1.4" fill="#cfe0fb"/>
      <circle cx="8" cy="14.4" r="1.5" fill="#cfe0fb"/><circle cx="16" cy="14.4" r="1.5" fill="#cfe0fb"/>
      <rect x="6" y="17.6" width="3" height="3.4" rx="1.1" fill="#1258c8"/>
      <rect x="15" y="17.6" width="3" height="3.4" rx="1.1" fill="#1258c8"/>
    </svg>
    <div style="min-width:0">
      <div id="titolo">Autobus in tempo reale</div>
      <div id="sottotitolo">Friuli Venezia Giulia, rete TPL FVG</div>
    </div>
  </div>

  <div id="spazio"></div>

  <div class="pill" title="Mezzi dei quali il servizio ha fornito una posizione valida">
    <b id="conteggio">0</b><span class="etichetta-lunga">mezzi con posizione disponibile</span><span class="etichetta-breve" aria-hidden="true">mezzi</span><span class="solo-lettori">mezzi con posizione disponibile</span>
  </div>
  <div class="pill" id="stato-pill">
    <span id="spia" aria-hidden="true"></span><span id="stato">In avvio</span>
  </div>
  <button id="aggiorna" class="bottone primario" aria-label="Aggiorna ora le posizioni">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 4v7h-7"/></svg>
    <span class="etichetta-lunga">Aggiorna ora</span>
  </button>
</header>

<div id="corpo">

  <aside id="pannello" aria-label="Filtri e ricerca">
    <div class="sezione">
      <h2>Tipo di servizio</h2>
      <div class="filtri">
        <button class="filtro" data-tipo="urbano" aria-pressed="true"><span class="bollo" aria-hidden="true"></span>Urbani</button>
        <button class="filtro" data-tipo="extraurbano" aria-pressed="true"><span class="bollo" aria-hidden="true"></span>Extraurbani</button>
      </div>
    </div>

    <div class="sezione">
      <h2>Ricerca</h2>
      <div class="campo" id="campo-linea">
        <label class="solo-lettori" for="cerca-linea">Cerca una linea</label>
        <input id="cerca-linea" type="search" placeholder="Linea, per esempio P13 oppure 2" autocomplete="off" enterkeyhint="search">
        <button class="pulisci" data-svuota="cerca-linea" aria-label="Cancella la ricerca della linea">&times;</button>
      </div>
      <div class="campo" id="campo-luogo">
        <label class="solo-lettori" for="cerca-luogo">Cerca una località oppure una fermata</label>
        <input id="cerca-luogo" type="search" placeholder="Località oppure fermata" autocomplete="off" enterkeyhint="search"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggerimenti">
        <button class="pulisci" data-svuota="cerca-luogo" aria-label="Cancella la ricerca del luogo">&times;</button>
      </div>
      <ul id="suggerimenti" role="listbox" aria-label="Risultati della ricerca"></ul>
    </div>

    <div id="elenco-zona">
      <div class="sezione">
        <h2>Mezzi visibili sulla mappa (<span id="conteggio-elenco">0</span>)</h2>
        <ul id="elenco" aria-label="Elenco dei mezzi visibili"></ul>
        <p id="vuoto">Nessun mezzo da mostrare.</p>
      </div>
    </div>
  </aside>

  <div id="velo" hidden></div>

  <div id="mappa-zona">
    <div id="mappa" role="application" aria-label="Mappa degli autobus in circolazione"></div>

    <p id="avviso" role="status" aria-live="polite"></p>

    <div id="comandi-mappa">
      <button id="tutta-regione" class="bottone" aria-label="Mostra tutta la regione">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.2v13.6L9 17.6l6 2.2 6-2.2V4l-6 2.2z"/><path d="M9 4v13.6M15 6.2V19.8"/></svg>
        <span class="etichetta-lunga">Tutta la regione</span>
      </button>
      <button id="schermo-intero" class="bottone solo-icona" aria-label="Schermo intero" aria-pressed="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </div>

    <section id="scheda" aria-live="polite" aria-label="Dettaglio del mezzo selezionato">
      <div class="testa" id="scheda-testa">
        <div class="linea" id="scheda-linea">&nbsp;</div>
        <div class="verso">
          <div class="etichetta">Direzione</div>
          <div class="valore" id="scheda-destinazione">&nbsp;</div>
        </div>
        <button id="chiudi-scheda" aria-label="Chiudi la scheda del mezzo">&times;</button>
      </div>
      <dl id="scheda-dati"></dl>
      <p id="nota-scheda"></p>
      <div class="piede">
        <button id="segui" class="bottone" aria-pressed="false">Segui questo autobus</button>
      </div>
    </section>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Autobus in tempo reale in Friuli Venezia Giulia
   Interfaccia per le posizioni dei mezzi della rete TPL FVG.
   Nessun dato viene stimato o ricostruito: si mostra soltanto ciò che il
   servizio restituisce. Le note tecniche vanno nella console del browser.
   ========================================================================= */

/* ----------------------------- configurazione ---------------------------- */
const LABEL_ZOOM      = 12;      // da questo livello compaiono le bandierine
const ZOOM_GRUPPI     = 10;      // sotto questo livello si mostrano i raggruppamenti
const INTERVALLO_MS   = 30000;   // cadenza di aggiornamento
const TIMEOUT_MS      = 12000;   // attesa massima per ogni richiesta
const STANTIO_MS      = 120000;  // oltre questa età il mezzo è segnato come non aggiornato
const SCADENZA_MS     = 300000;  // oltre questa età il mezzo è tolto dalla mappa
const ANIMAZIONE_MS   = 800;     // durata del passaggio fra due posizioni ricevute
const MAX_BANDIERINE  = 240;     // limite di bandierine disegnate insieme
const RITENTA_MS      = [5000, 15000, 40000, 90000];   // attese dopo un errore

// Modalità diretta dal browser: quante richieste per ogni giro.
const DIRETTA_PER_GIRO  = 24;
const DIRETTA_PARALLELE = 4;

// Aggregatore ospitato in rete, per il sito pubblicato. Da compilare una volta
// sola con l'indirizzo del proprio aggregatore, per esempio
// "https://miosito.esempio/api/mezzi". Lasciato vuoto, la pagina interroga il
// servizio TPL FVG direttamente, con copertura molto piu' stretta.
const AGGREGATORE_REMOTO = "";

// Si puo' indicare anche dall'indirizzo della pagina, con ?aggregatore=...
// Sono ammessi solo indirizzi cifrati, per non mescolare traffico in chiaro.
function aggregatoreDaIndirizzo() {
  try {
    const v = new URLSearchParams(location.search).get("aggregatore");
    if (v && /^https:\/\//i.test(v)) return v;
    if (v) console.warn("[fonte] indirizzo dell'aggregatore ignorato, non cifrato: " + v);
  } catch (e) { /* indirizzo non leggibile */ }
  return null;
}

// L'aggregatore sulla macchina di chi guarda si cerca solo quando la pagina
// e' aperta in locale. Dal sito pubblicato sarebbe un tentativo inutile, che i
// browser recenti segnalano come accesso alla rete privata.
const IN_LOCALE = ["localhost", "127.0.0.1", "[::1]", ""].includes(location.hostname);

// Indirizzi provati nell'ordine: quello indicato, poi quelli locali.
const AGGREGATORI = [
  aggregatoreDaIndirizzo(),
  AGGREGATORE_REMOTO,
  "./api/mezzi",
  IN_LOCALE ? "http://127.0.0.1:8080/api/mezzi" : null
].filter(Boolean);

// Servizio ufficiale delle corse monitorate a una fermata.
const BASE_TEMPO_REALE = "https://realtime.tplfvg.it/API/v1.0/polemonitor/mrcruns";
// Catalogo ufficiale delle fermate, usato per la ricerca completa.
const BASE_FERMATE     = "https://tplfvg.it/services/geojson/points/";

// Riquadro del Friuli Venezia Giulia, con un margine di sicurezza.
const RIQUADRO = { latMin: 45.30, latMax: 47.00, lonMin: 12.00, lonMax: 14.10 };
const CONFINI  = L.latLngBounds([45.44, 12.16], [46.78, 13.96]);

/* ------------------------------- stato ----------------------------------- */
const RETE = JSON.parse(document.getElementById("dati-rete").textContent);
const LOCALITA = RETE.localita;                 // [nome, lat, lon, numero fermate]
const FERMATE  = RETE.fermate;                  // [codice, lat, lon, maschera, priorità]

const mezzi = new Map();            // identificativo -> dati del mezzo
const marker = new Map();           // identificativo -> puntino
const bandierine = new Map();       // identificativo -> bandierina
const anim = new Map();             // identificativo -> passaggio in corso

let filtri     = { urbano: true, extraurbano: true, linea: "" };
let scelto     = null;              // identificativo del mezzo selezionato
let seguito    = null;              // identificativo del mezzo inseguito
let modalita   = null;              // "aggregatore" oppure "diretta"
let indirizzoAggregatore = null;
let timer = null, inCorso = false, fallimenti = 0;
let ultimoEsito = null, copertura = null;
let catalogo = null, catalogoInCaricamento = false;
let cursoreDiretta = 0;
const menoMoto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------- utilità --------------------------------- */
const $ = (s) => document.querySelector(s);

function numero(v) {
  if (typeof v === "number") return v;
  if (typeof v !== "string") return NaN;
  return parseFloat(v.trim().replace(",", "."));
}

/** Accetta la posizione solo se è un punto reale dentro la regione. */
function posizioneValida(lat, lon) {
  if (!isFinite(lat) || !isFinite(lon)) return false;
  if (lat === 0 || lon === 0) return false;
  return lat >= RIQUADRO.latMin && lat <= RIQUADRO.latMax
      && lon >= RIQUADRO.lonMin && lon <= RIQUADRO.lonMax;
}

/** Il tipo di servizio si legge da LineType. Le sigle ignote non si forzano. */
function tipoServizio(lineType) {
  const t = String(lineType == null ? "" : lineType).trim().toUpperCase();
  if (t === "1U" || t === "U") return "urbano";
  if (t === "1E" || t === "E") return "extraurbano";
  return "altro";
}

function testo(v) {
  if (v == null) return "";
  const s = String(v).trim();
  return (s === "null" || s === "undefined") ? "" : s;
}

function ora(ms) {
  return new Date(ms).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function eta(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + " secondi fa";
  const m = Math.round(s / 60);
  return m === 1 ? "1 minuto fa" : m + " minuti fa";
}

function conAttesa(url, ms) {
  const ferma = new AbortController();
  const t = setTimeout(() => ferma.abort(), ms);
  return fetch(url, { signal: ferma.signal, cache: "no-store", credentials: "omit" })
    .finally(() => clearTimeout(t));
}

/** Esegue i compiti a gruppi, per non aprire troppe richieste insieme. */
async function aGruppi(elementi, quanti, compito) {
  const esiti = [];
  for (let i = 0; i < elementi.length; i += quanti) {
    const parte = elementi.slice(i, i + quanti);
    esiti.push(...await Promise.all(parte.map(compito)));
  }
  return esiti;
}

/* --------------------- lettura di una corsa ricevuta --------------------- */
/**
 * Trasforma una corsa restituita dal servizio in un mezzo da mostrare.
 * Restituisce null se la posizione non è utilizzabile oppure se i dati
 * dicono che il mezzo non è ancora partito.
 */
function leggiCorsa(c, ricevuto) {
  if (!c || typeof c !== "object") return null;

  // Un mezzo dichiarato non ancora in servizio non va sulla mappa.
  if (c.IsStarted === false || c.IsStarted === "false" || c.IsStarted === 0) return null;

  const lat = numero(c.Latitude), lon = numero(c.Longitude);
  if (!posizioneValida(lat, lon)) return null;

  const veicolo = testo(c.Vehicle);
  const sigla   = testo(c.LineCode) || testo(c.Line) || "?";
  const corsa   = testo(c.Race);
  // Senza identificativo del mezzo si ripiega su una chiave stabile della corsa.
  const id = veicolo ? "v:" + veicolo : "c:" + sigla + "|" + corsa + "|" + lat.toFixed(4) + "," + lon.toFixed(4);

  return {
    id, veicolo, sigla,
    linea:        testo(c.Line),
    tipo:         tipoServizio(c.LineType),
    tipoGrezzo:   testo(c.LineType),
    corsa,
    direzione:    testo(c.Direction),
    destinazione: testo(c.Destination),
    partenza:     testo(c.Departure),
    arrivo:       testo(c.ArrivalTime),
    ripartenza:   testo(c.DepartureTime),
    orarioCorsa:  testo(c.Time),
    lat, lon,
    ricevuto                      // ora di ricezione: non è un orario GPS
  };
}

/** Inserisce o aggiorna un mezzo, tenendo sempre la lettura più recente. */
function deposita(m) {
  if (!m) return;
  const vecchio = mezzi.get(m.id);
  if (vecchio && vecchio.ricevuto > m.ricevuto) return;
  if (vecchio) {
    m.latPrec = vecchio.lat;
    m.lonPrec = vecchio.lon;
    m.mosso = (vecchio.lat !== m.lat || vecchio.lon !== m.lon);
  }
  mezzi.set(m.id, m);
}

/* ====================== acquisizione dei dati ============================= */

/** Cerca l'aggregatore locale. Se non risponde si passa alla modalità diretta. */
async function scegliModalita() {
  for (const ind of AGGREGATORI) {
    try {
      const r = await conAttesa(ind, 4000);
      if (!r.ok) continue;
      const d = await r.json();
      if (d && Array.isArray(d.mezzi)) {
        indirizzoAggregatore = ind;
        modalita = "aggregatore";
        console.info("[fonte] aggregatore locale attivo:", ind);
        return;
      }
    } catch (e) { /* si prova il successivo */ }
  }
  modalita = "diretta";
  console.info("[fonte] nessun aggregatore locale: richieste dirette dal browser a", BASE_TEMPO_REALE);
}

/** Legge tutta la flotta già raccolta e deduplicata dall'aggregatore. */
async function daAggregatore() {
  const r = await conAttesa(indirizzoAggregatore, TIMEOUT_MS);
  if (!r.ok) throw new Error("aggregatore: risposta " + r.status);
  const d = await r.json();
  const adesso = Date.now();
  let validi = 0, scartati = 0;
  for (const c of d.mezzi) {
    const m = leggiCorsa(c, c.__ricevuto ? Date.parse(c.__ricevuto) : adesso);
    if (m) { deposita(m); validi++; } else { scartati++; }
  }
  copertura = d.copertura || null;
  console.info("[aggregatore] corse valide " + validi + ", scartate " + scartati +
               (d.copertura ? ", fermate lette " + d.copertura.fermateLette + " su " + d.copertura.fermateTotali : ""));
  return validi;
}

/** Interroga una singola fermata per un tipo di servizio. */
async function leggiFermata(codice, urbano) {
  const url = BASE_TEMPO_REALE + "?StopCode=" + encodeURIComponent(codice) + "&IsUrban=" + (urbano ? "true" : "false");
  const r = await conAttesa(url, TIMEOUT_MS);
  if (!r.ok) throw new Error("fermata " + codice + ": risposta " + r.status);
  const d = await r.json();
  // La risposta può essere un elenco oppure un oggetto che lo contiene.
  if (Array.isArray(d)) return d;
  if (d && Array.isArray(d.Runs)) return d.Runs;
  if (d && Array.isArray(d.runs)) return d.runs;
  return [];
}

/**
 * Modalità diretta: a ogni giro si interroga soltanto una parte delle fermate
 * selezionate, a rotazione, per non gravare sul servizio pubblico.
 * La copertura è quindi parziale e cresce con il passare dei giri.
 */
async function daServizio() {
  const compiti = [];
  for (let i = 0; i < DIRETTA_PER_GIRO && i < FERMATE.length; i++) {
    const f = FERMATE[(cursoreDiretta + i) % FERMATE.length];
    const maschera = f[3];
    if (maschera & 1) compiti.push([f[0], true]);
    if (maschera & 2) compiti.push([f[0], false]);
  }
  cursoreDiretta = (cursoreDiretta + DIRETTA_PER_GIRO) % FERMATE.length;

  const adesso = Date.now();
  let validi = 0, errori = 0;
  await aGruppi(compiti, DIRETTA_PARALLELE, async ([codice, urbano]) => {
    try {
      const corse = await leggiFermata(codice, urbano);
      for (const c of corse) {
        const m = leggiCorsa(c, adesso);
        if (m) { deposita(m); validi++; }
      }
    } catch (e) { errori++; console.debug("[diretta] " + codice + ": " + e.message); }
  });

  if (errori === compiti.length && compiti.length > 0) {
    throw new Error("nessuna delle " + compiti.length + " richieste ha risposto");
  }
  copertura = {
    modo: "diretta",
    fermateTotali: FERMATE.length,
    fermateLette: Math.min(FERMATE.length, cursoreDiretta || FERMATE.length),
    richiesteUltimoGiro: compiti.length,
    erroriUltimoGiro: errori
  };
  console.info("[diretta] richieste " + compiti.length + ", errori " + errori + ", corse valide " + validi);
  return validi;
}

/** Toglie i mezzi non più rilevati e segna quelli non aggiornati. */
function invecchia() {
  const adesso = Date.now();
  for (const [id, m] of mezzi) {
    const eta = adesso - m.ricevuto;
    if (eta > SCADENZA_MS) {
      mezzi.delete(id);
      if (scelto === id) chiudiScheda();
      if (seguito === id) seguito = null;
    } else {
      m.stantio = eta > STANTIO_MS;
    }
  }
}

/** Un giro completo di aggiornamento. */
async function aggiorna(manuale) {
  if (inCorso) return;
  if (document.hidden && !manuale) return;   // a scheda nascosta non si interroga nulla
  inCorso = true;
  segnala("attesa", "Aggiornamento in corso", "In corso");

  try {
    if (!modalita) await scegliModalita();
    const validi = (modalita === "aggregatore") ? await daAggregatore() : await daServizio();

    fallimenti = 0;
    ultimoEsito = Date.now();
    invecchia();
    disegna();
    aggiornaScheda();

    if (mezzi.size === 0) {
      segnala("attesa", "Nessuna posizione disponibile", "Nessuna posizione");
    } else {
      segnala("ok", "Aggiornato alle " + ora(ultimoEsito), ora(ultimoEsito));
    }
    console.info("[giro] mezzi in memoria " + mezzi.size + ", nuove letture " + validi);
  } catch (e) {
    fallimenti++;
    console.warn("[giro] non riuscito (" + fallimenti + "): " + e.message);
    invecchia();
    disegna();
    // Le ultime posizioni restano visibili, ma dichiarate come non aggiornate.
    segnala("guasto", mezzi.size
      ? "Aggiornamento non disponibile, posizioni delle " + (ultimoEsito ? ora(ultimoEsito) : "ultima lettura")
      : "Aggiornamento non disponibile", "Non disponibile");
  } finally {
    inCorso = false;
    riprogramma();
  }
}

/** Riprogramma il giro successivo, distanziando i tentativi dopo un errore. */
function riprogramma() {
  clearTimeout(timer);
  if (document.hidden) return;               // sospensione a scheda nascosta
  const attesa = fallimenti > 0
    ? RITENTA_MS[Math.min(fallimenti - 1, RITENTA_MS.length - 1)]
    : INTERVALLO_MS;
  timer = setTimeout(() => aggiorna(false), attesa);
}

function segnala(classe, messaggio, breve) {
  const spia = $("#spia"), stato = $("#stato");
  spia.className = classe;
  stato.textContent = (window.innerWidth <= 620 && breve) ? breve : messaggio;
  $("#stato-pill").title = messaggio + (copertura && copertura.fermateTotali
    ? " · fermate interrogate " + copertura.fermateLette + " su " + copertura.fermateTotali
    : "");
}

function avvisa(messaggio, durata) {
  const a = $("#avviso");
  a.textContent = messaggio;
  a.classList.add("visibile");
  clearTimeout(avvisa._t);
  avvisa._t = setTimeout(() => a.classList.remove("visibile"), durata || 4200);
}

/* ============================ la mappa =================================== */

const mappa = L.map("mappa", {
  zoomControl: true,
  preferCanvas: true,
  zoomSnap: 0.5,
  wheelPxPerZoomLevel: 110,
  minZoom: 7,
  maxZoom: 18,
  worldCopyJump: false,
  tap: true
});
mappa.zoomControl.setPosition("topleft");

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution:
    'Cartografia &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, ' +
    'contributori · posizioni dei mezzi: <a href="https://tplfvg.it/">TPL FVG</a>'
}).addTo(mappa);

mappa.fitBounds(CONFINI, { padding: [12, 12] });

const disegnatore   = L.canvas({ padding: 0.4 });
const stratoPunti   = L.layerGroup().addTo(mappa);
const stratoBandiere= L.layerGroup().addTo(mappa);
const stratoGruppi  = L.layerGroup().addTo(mappa);

const COLORI = {
  urbano:      { pieno: "#1258c8", scelto: "#0c3f92" },
  extraurbano: { pieno: "#e2680c", scelto: "#a94b06" },
  altro:       { pieno: "#5b6470", scelto: "#3d444d" },
  stantio:     { pieno: "#8a94a2", scelto: "#6b7482" }
};

/* -------------------------- selezione dei mezzi -------------------------- */
function passaFiltri(m) {
  if (m.tipo === "urbano" && !filtri.urbano) return false;
  if (m.tipo === "extraurbano" && !filtri.extraurbano) return false;
  if (m.tipo === "altro" && !filtri.urbano && !filtri.extraurbano) return false;
  if (filtri.linea) {
    const ago = filtri.linea.toLowerCase();
    if (!(m.sigla.toLowerCase().includes(ago) || m.linea.toLowerCase().includes(ago))) return false;
  }
  return true;
}

function mezziFiltrati() {
  const fuori = [];
  for (const m of mezzi.values()) if (passaFiltri(m)) fuori.push(m);
  return fuori;
}

/* ------------------- passaggio fra due posizioni ricevute ---------------- */
function avviaPassaggio(m) {
  if (menoMoto || !m.mosso || m.latPrec == null) return;
  anim.set(m.id, { daLat: m.latPrec, daLon: m.lonPrec, aLat: m.lat, aLon: m.lon, t0: performance.now() });
  if (!avviaPassaggio._attivo) { avviaPassaggio._attivo = true; requestAnimationFrame(passo); }
}

function passo(t) {
  let restano = false;
  for (const [id, a] of anim) {
    const k = Math.min(1, (t - a.t0) / ANIMAZIONE_MS);
    const e = 1 - Math.pow(1 - k, 3);
    a.lat = a.daLat + (a.aLat - a.daLat) * e;
    a.lon = a.daLon + (a.aLon - a.daLon) * e;
    if (k >= 1) anim.delete(id); else restano = true;
  }
  posiziona();
  if (restano) requestAnimationFrame(passo);
  else { avviaPassaggio._attivo = false; posiziona(); }
}

/** Posizione da disegnare: quella animata se il passaggio è in corso. */
function puntoDi(m) {
  const a = anim.get(m.id);
  return (a && a.lat != null) ? [a.lat, a.lon] : [m.lat, m.lon];
}

/* ----------------------- separazione delle sovrapposizioni --------------- */
/**
 * Vicino alle stazioni più mezzi condividono la stessa posizione.
 * Si distribuiscono su una piccola corona attorno al punto, in modo
 * stabile e ripetibile, così ognuno resta selezionabile.
 */
function scostamenti(lista) {
  const gruppi = new Map();
  for (const m of lista) {
    const p = puntoDi(m);
    const chiave = p[0].toFixed(4) + "," + p[1].toFixed(4);
    if (!gruppi.has(chiave)) gruppi.set(chiave, []);
    gruppi.get(chiave).push(m);
  }
  const esito = new Map();
  for (const insieme of gruppi.values()) {
    if (insieme.length === 1) {
      esito.set(insieme[0].id, puntoDi(insieme[0]));
      continue;
    }
    insieme.sort((a, b) => a.id < b.id ? -1 : 1);   // ordine stabile fra un giro e l'altro
    const conBandierine = mappa.getZoom() >= LABEL_ZOOM;
    const raggio = (conBandierine ? 15 : 8) + Math.min(insieme.length, 8) * (conBandierine ? 2.4 : 1.6);
    insieme.forEach((m, i) => {
      const ang = (2 * Math.PI * i) / insieme.length - Math.PI / 2;
      const p = mappa.latLngToLayerPoint(puntoDi(m));
      const q = mappa.layerPointToLatLng(L.point(p.x + Math.cos(ang) * raggio, p.y + Math.sin(ang) * raggio));
      esito.set(m.id, [q.lat, q.lng]);
    });
  }
  return esito;
}

/* ----------------------------- raggruppamenti ---------------------------- */
function raggruppa(lista) {
  const PASSO = 62;                     // lato della cella, in punti dello schermo
  const celle = new Map();
  for (const m of lista) {
    const p = mappa.latLngToLayerPoint(puntoDi(m));
    const k = Math.floor(p.x / PASSO) + ":" + Math.floor(p.y / PASSO);
    let c = celle.get(k);
    if (!c) { c = { x: 0, y: 0, n: 0, urbani: 0, extra: 0, mezzi: [] }; celle.set(k, c); }
    c.x += p.x; c.y += p.y; c.n++;
    if (m.tipo === "urbano") c.urbani++;
    if (m.tipo === "extraurbano") c.extra++;
    c.mezzi.push(m);
  }
  return [...celle.values()].map(c => {
    const centro = mappa.layerPointToLatLng(L.point(c.x / c.n, c.y / c.n));
    return { centro, n: c.n, urbani: c.urbani, extra: c.extra, mezzi: c.mezzi };
  });
}

/* --------------------------- disegno sulla mappa ------------------------- */
let insiemeDisegnato = [];

function disegna() {
  const z = mappa.getZoom();
  const lista = mezziFiltrati();

  $("#conteggio").textContent = mezzi.size;

  if (z < ZOOM_GRUPPI) {
    svuotaPunti(); svuotaBandierine();
    disegnaGruppi(lista);
    insiemeDisegnato = [];
    aggiornaElenco(lista.filter(m => mappa.getBounds().contains(puntoDi(m))));
  } else {
    stratoGruppi.clearLayers();
    const bordi = mappa.getBounds().pad(0.3);
    const inVista = lista.filter(m => bordi.contains(puntoDi(m)));
    insiemeDisegnato = inVista;
    disegnaPunti(inVista, z);
    aggiornaElenco(lista.filter(m => mappa.getBounds().contains(puntoDi(m))));
  }
}

function svuotaPunti() { stratoPunti.clearLayers(); marker.clear(); }
function svuotaBandierine() { stratoBandiere.clearLayers(); bandierine.clear(); }

function disegnaGruppi(lista) {
  stratoGruppi.clearLayers();
  for (const g of raggruppa(lista)) {
    if (g.n === 1) {
      const m = g.mezzi[0];
      const c = colore(m);
      L.circleMarker(puntoDi(m), {
        renderer: disegnatore, radius: 6.5, weight: 2.2,
        color: "#ffffff", fillColor: c.pieno, fillOpacity: 1,
        interactive: true, bubblingMouseEvents: false
      }).on("click", () => seleziona(m.id)).addTo(stratoGruppi);
      continue;
    }
    const taglia = g.n < 10 ? "p" : (g.n < 50 ? "m" : "g");
    const classe = g.urbani && g.extra ? "misto" : (g.extra > g.urbani ? "extraurbano" : "urbano");
    const icona = L.divIcon({
      className: "gruppo-guscio", iconSize: null,
      html: '<div class="gruppo ' + classe + ' ' + taglia + '" role="button" tabindex="0" ' +
            'aria-label="' + g.n + ' mezzi in questa zona, ingrandisci per vederli">' + g.n + "</div>"
    });
    L.marker(g.centro, { icon: icona, keyboard: false })
      .on("click", () => mappa.flyToBounds(L.latLngBounds(g.mezzi.map(puntoDi)).pad(0.35), { maxZoom: 14 }))
      .addTo(stratoGruppi);
  }
}

function colore(m) {
  if (m.stantio) return COLORI.stantio;
  return COLORI[m.tipo] || COLORI.altro;
}

function disegnaPunti(inVista, z) {
  const posti = scostamenti(inVista);
  const vivi = new Set();

  for (const m of inVista) {
    vivi.add(m.id);
    const p = posti.get(m.id) || puntoDi(m);
    const c = colore(m);
    const eScelto = (m.id === scelto);
    let pt = marker.get(m.id);
    if (!pt) {
      pt = L.circleMarker(p, {
        renderer: disegnatore, radius: eScelto ? 8.5 : 6.5, weight: eScelto ? 3 : 2.2,
        color: "#ffffff", fillColor: c.pieno, fillOpacity: 1,
        interactive: true, bubblingMouseEvents: false
      });
      pt.on("click", () => seleziona(m.id));
      pt.addTo(stratoPunti);
      marker.set(m.id, pt);
    } else {
      pt.setLatLng(p);
      // Si ridisegna soltanto quando qualcosa è davvero cambiato.
      if (pt.options.fillColor !== c.pieno || pt._scelto !== eScelto) {
        pt.setStyle({ fillColor: c.pieno, radius: eScelto ? 8.5 : 6.5, weight: eScelto ? 3 : 2.2 });
      }
    }
    pt._scelto = eScelto;
  }

  for (const [id, pt] of marker) {
    if (!vivi.has(id)) { stratoPunti.removeLayer(pt); marker.delete(id); }
  }

  if (z >= LABEL_ZOOM) disegnaBandierine(inVista, posti);
  else svuotaBandierine();
}

/** Le bandierine si disegnano solo per i mezzi in vista e solo fino al limite. */
function disegnaBandierine(inVista, posti) {
  let candidati = inVista;
  if (candidati.length > MAX_BANDIERINE) {
    const centro = mappa.getCenter();
    candidati = candidati.slice().sort((a, b) => {
      if (a.id === scelto) return -1;
      if (b.id === scelto) return 1;
      const pa = puntoDi(a), pb = puntoDi(b);
      return centro.distanceTo(pa) - centro.distanceTo(pb);
    }).slice(0, MAX_BANDIERINE);
  }
  // La bandierina del mezzo selezionato resta sempre presente.
  if (scelto && !candidati.some(m => m.id === scelto)) {
    const s = mezzi.get(scelto);
    if (s && passaFiltri(s)) candidati = candidati.concat([s]);
  }

  const vivi = new Set();
  for (const m of candidati) {
    vivi.add(m.id);
    const p = posti.get(m.id) || puntoDi(m);
    const classi = "bandierina " + (m.stantio ? "stantia" : m.tipo) + (m.id === scelto ? " scelta" : "");
    let b = bandierine.get(m.id);
    if (!b) {
      b = L.marker(p, {
        icon: L.divIcon({ className: "bandierina-guscio", iconSize: null,
          html: '<span class="' + classi + '">' + escapaHtml(m.sigla) + "</span>" }),
        keyboard: false, zIndexOffset: m.id === scelto ? 1000 : 0, riseOnHover: true
      });
      b.on("click", () => seleziona(m.id));
      b.addTo(stratoBandiere);
      bandierine.set(m.id, b);
      b._classi = classi; b._sigla = m.sigla;
    } else {
      b.setLatLng(p);
      if (b._classi !== classi || b._sigla !== m.sigla) {
        const el = b.getElement() && b.getElement().firstChild;
        if (el) { el.className = classi; el.textContent = m.sigla; }
        else b.setIcon(L.divIcon({ className: "bandierina-guscio", iconSize: null,
              html: '<span class="' + classi + '">' + escapaHtml(m.sigla) + "</span>" }));
        b._classi = classi; b._sigla = m.sigla;
        b.setZIndexOffset(m.id === scelto ? 1000 : 0);
      }
    }
  }
  for (const [id, b] of bandierine) {
    if (!vivi.has(id)) { stratoBandiere.removeLayer(b); bandierine.delete(id); }
  }
}

/** Aggiornamento leggero delle sole posizioni, durante il passaggio animato. */
function posiziona() {
  if (mappa.getZoom() < ZOOM_GRUPPI || insiemeDisegnato.length === 0) return;
  const posti = scostamenti(insiemeDisegnato);
  for (const m of insiemeDisegnato) {
    const p = posti.get(m.id) || puntoDi(m);
    const pt = marker.get(m.id); if (pt) pt.setLatLng(p);
    const b = bandierine.get(m.id); if (b) b.setLatLng(p);
  }
  if (seguito) {
    const m = mezzi.get(seguito);
    if (m) mappa.panTo(puntoDi(m), { animate: !menoMoto, duration: 0.5, noMoveStart: true });
  }
}

function escapaHtml(s) {
  return String(s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

/* ========================= elenco laterale =============================== */
const MAX_ELENCO = 120;

function aggiornaElenco(inVista) {
  const ul = $("#elenco"), vuoto = $("#vuoto");
  $("#conteggio-elenco").textContent = inVista.length;

  if (inVista.length === 0) {
    ul.innerHTML = "";
    vuoto.style.display = "block";
    vuoto.textContent = mezzi.size === 0
      ? "Nessuna posizione disponibile in questo momento."
      : "Nessun mezzo in questa zona con i filtri scelti.";
    return;
  }
  vuoto.style.display = "none";

  const ordinati = inVista.slice().sort((a, b) =>
    a.sigla.localeCompare(b.sigla, "it", { numeric: true }) || a.id.localeCompare(b.id));
  const parti = [];
  for (const m of ordinati.slice(0, MAX_ELENCO)) {
    parti.push(
      '<li><button class="voce' + (m.stantio ? " stantia" : "") + '" data-id="' + escapaHtml(m.id) + '"' +
      (m.id === scelto ? ' aria-current="true"' : "") + '>' +
        '<span class="sigla ' + m.tipo + '">' + escapaHtml(m.sigla) + "</span>" +
        '<span class="testo">' +
          '<span class="dove">' + escapaHtml(m.destinazione || m.linea || "Direzione non indicata") + "</span>" +
          '<span class="quando">' + (m.stantio ? "Non aggiornato, " : "") + eta(m.ricevuto) + "</span>" +
        "</span>" +
      "</button></li>");
  }
  if (ordinati.length > MAX_ELENCO) {
    parti.push('<li><p style="font-size:12px;color:var(--tenue);padding:4px 2px;margin:0">' +
      "Altri " + (ordinati.length - MAX_ELENCO) + " mezzi in questa zona: ingrandisci per vederli in elenco.</p></li>");
  }
  ul.innerHTML = parti.join("");
}

$("#elenco").addEventListener("click", (e) => {
  const b = e.target.closest(".voce");
  if (b) seleziona(b.dataset.id, true);
});

/* ========================= scheda del mezzo ============================== */
function seleziona(id, daElenco) {
  scelto = id;
  const m = mezzi.get(id);
  if (!m) { chiudiScheda(); return; }
  if (daElenco) mappa.setView(puntoDi(m), Math.max(mappa.getZoom(), LABEL_ZOOM), { animate: !menoMoto });
  aggiornaScheda();
  disegna();
  if (window.innerWidth <= 820) chiudiPannello();
}

function aggiornaScheda() {
  const s = $("#scheda");
  if (!scelto) { s.classList.remove("visibile"); return; }
  const m = mezzi.get(scelto);
  if (!m) { chiudiScheda(); return; }

  s.classList.add("visibile");
  $("#scheda-testa").className = "testa " + m.tipo;
  $("#scheda-linea").textContent = m.sigla;
  $("#scheda-destinazione").textContent = m.destinazione || m.direzione || "Non indicata";

  const righe = [];
  const aggiungi = (etichetta, valore) => {
    if (valore) righe.push("<dt>" + escapaHtml(etichetta) + "</dt><dd>" + escapaHtml(valore) + "</dd>");
  };
  aggiungi("Linea", m.linea || m.sigla);
  aggiungi("Servizio", m.tipo === "urbano" ? "Urbano"
    : m.tipo === "extraurbano" ? "Extraurbano"
    : "Non classificato dal servizio" + (m.tipoGrezzo ? " (codice " + m.tipoGrezzo + ")" : ""));
  aggiungi("Mezzo", m.veicolo || "Identificativo non fornito");
  aggiungi("Corsa", m.corsa);
  aggiungi("Partenza", m.partenza);
  aggiungi("Arrivo previsto", m.arrivo);
  aggiungi("Ripartenza prevista", m.ripartenza);
  aggiungi("Orario della corsa", m.orarioCorsa);
  righe.push("<dt>Posizione ricevuta</dt><dd>" + ora(m.ricevuto) + ", " + eta(m.ricevuto) + "</dd>");
  $("#scheda-dati").innerHTML = righe.join("");

  const nota = $("#nota-scheda");
  const avvertenze = [];
  if (m.stantio) avvertenze.push("Posizione non aggiornata: il servizio non rileva questo mezzo da più di due minuti.");
  avvertenze.push("L'ora indicata è quella di ricezione del dato, non un orario fornito dal navigatore satellitare del mezzo.");
  nota.textContent = avvertenze.join(" ");
  nota.classList.add("visibile");

  const b = $("#segui");
  const attivo = (seguito === m.id);
  b.setAttribute("aria-pressed", attivo ? "true" : "false");
  b.textContent = attivo ? "Smetti di seguire" : "Segui questo autobus";
}

function chiudiScheda() {
  scelto = null; seguito = null;
  $("#scheda").classList.remove("visibile");
  disegna();
}

$("#chiudi-scheda").addEventListener("click", chiudiScheda);

$("#segui").addEventListener("click", () => {
  if (!scelto) return;
  seguito = (seguito === scelto) ? null : scelto;
  if (seguito) {
    const m = mezzi.get(seguito);
    if (m) mappa.setView(puntoDi(m), Math.max(mappa.getZoom(), LABEL_ZOOM), { animate: !menoMoto });
    avvisa("La mappa segue il mezzo selezionato");
  }
  aggiornaScheda();
});

/* ============================== filtri =================================== */
document.querySelectorAll(".filtro").forEach(b => {
  b.addEventListener("click", () => {
    const t = b.dataset.tipo;
    filtri[t] = !filtri[t];
    b.setAttribute("aria-pressed", filtri[t] ? "true" : "false");
    disegna();
  });
});

const campoLinea = $("#cerca-linea");
campoLinea.addEventListener("input", () => {
  filtri.linea = campoLinea.value.trim();
  campoLinea.closest(".campo").classList.toggle("pieno", !!campoLinea.value);
  disegna();
});

document.querySelectorAll(".pulisci").forEach(b => {
  b.addEventListener("click", () => {
    const campo = document.getElementById(b.dataset.svuota);
    campo.value = "";
    campo.dispatchEvent(new Event("input", { bubbles: true }));
    campo.focus();
  });
});

/* ==================== ricerca di località e fermate ====================== */
const campoLuogo = $("#cerca-luogo"), listaSugg = $("#suggerimenti");

/** Il catalogo completo delle fermate si scarica solo al primo bisogno. */
async function caricaCatalogo() {
  if (catalogo || catalogoInCaricamento) return;
  catalogoInCaricamento = true;
  try {
    const r = await conAttesa(BASE_FERMATE, 25000);
    if (!r.ok) throw new Error("risposta " + r.status);
    const d = await r.json();
    catalogo = d.features
      .filter(f => f.properties && f.properties.__type === "stop")
      .map(f => ({
        nome: f.properties.name || "",
        luogo: f.properties.location || "",
        codice: f.properties.code || "",
        lat: f.geometry.coordinates[1],
        lon: f.geometry.coordinates[0]
      }));
    console.info("[catalogo] fermate caricate: " + catalogo.length);
    if (campoLuogo.value.trim().length >= 2) cerca(campoLuogo.value.trim());
  } catch (e) {
    catalogo = [];
    console.warn("[catalogo] non disponibile: " + e.message);
  } finally {
    catalogoInCaricamento = false;
  }
}

function cerca(ago) {
  const q = ago.toLowerCase();
  const esiti = [];

  for (const [nome, lat, lon, n] of LOCALITA) {
    if (nome.toLowerCase().includes(q)) {
      esiti.push({ titolo: nome, sotto: n + (n === 1 ? " fermata" : " fermate"), lat, lon, zoom: 13 });
    }
    if (esiti.length >= 6) break;
  }
  if (catalogo) {
    for (const f of catalogo) {
      if (esiti.length >= 12) break;
      if (f.nome.toLowerCase().includes(q) || f.codice.toLowerCase() === q) {
        esiti.push({ titolo: f.nome, sotto: "Fermata " + f.codice, lat: f.lat, lon: f.lon, zoom: 16 });
      }
    }
  }

  if (!esiti.length) {
    listaSugg.innerHTML = '<li><button type="button" disabled style="color:var(--tenue)">' +
      (catalogoInCaricamento ? "Ricerca delle fermate in corso" : "Nessun risultato") + "</button></li>";
  } else {
    listaSugg.innerHTML = esiti.map(e =>
      '<li role="option"><button type="button" data-lat="' + e.lat + '" data-lon="' + e.lon + '" data-zoom="' + e.zoom + '">' +
      '<span class="luogo">' + escapaHtml(e.titolo) + "</span><br>" +
      '<span class="dettaglio">' + escapaHtml(e.sotto) + "</span></button></li>").join("");
  }
  listaSugg.classList.add("aperto");
  campoLuogo.setAttribute("aria-expanded", "true");
}

function chiudiSuggerimenti() {
  listaSugg.classList.remove("aperto");
  campoLuogo.setAttribute("aria-expanded", "false");
}

campoLuogo.addEventListener("input", () => {
  const v = campoLuogo.value.trim();
  campoLuogo.closest(".campo").classList.toggle("pieno", !!campoLuogo.value);
  if (v.length < 2) { chiudiSuggerimenti(); return; }
  caricaCatalogo();
  cerca(v);
});

listaSugg.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lat]");
  if (!b) return;
  mappa.setView([parseFloat(b.dataset.lat), parseFloat(b.dataset.lon)], parseInt(b.dataset.zoom, 10), { animate: !menoMoto });
  chiudiSuggerimenti();
  if (window.innerWidth <= 820) chiudiPannello();
});

campoLuogo.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { chiudiSuggerimenti(); return; }
  if (e.key === "ArrowDown") {
    const primo = listaSugg.querySelector("button:not([disabled])");
    if (primo) { e.preventDefault(); primo.focus(); }
  }
});
listaSugg.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { chiudiSuggerimenti(); campoLuogo.focus(); }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#campo-luogo") && !e.target.closest("#suggerimenti")) chiudiSuggerimenti();
});

/* ======================= comandi della mappa ============================= */
$("#tutta-regione").addEventListener("click", () => {
  seguito = null;
  aggiornaScheda();
  mappa.flyToBounds(CONFINI, { padding: [12, 12], duration: menoMoto ? 0 : 0.7 });
});

$("#schermo-intero").addEventListener("click", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  }
});
document.addEventListener("fullscreenchange", () => {
  $("#schermo-intero").setAttribute("aria-pressed", document.fullscreenElement ? "true" : "false");
  setTimeout(() => mappa.invalidateSize(), 220);
});

$("#aggiorna").addEventListener("click", () => {
  avvisa("Aggiornamento richiesto");
  aggiorna(true);
});

/* -------------------- pannello sugli schermi piccoli --------------------- */
const velo = $("#velo");
velo.removeAttribute("hidden");
function apriPannello() {
  $("#pannello").classList.add("aperto");
  velo.classList.add("visibile");
  $("#apri-pannello").setAttribute("aria-expanded", "true");
}
function chiudiPannello() {
  $("#pannello").classList.remove("aperto");
  velo.classList.remove("visibile");
  $("#apri-pannello").setAttribute("aria-expanded", "false");
}
$("#apri-pannello").addEventListener("click", () => {
  $("#pannello").classList.contains("aperto") ? chiudiPannello() : apriPannello();
});
velo.addEventListener("click", chiudiPannello);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#pannello").classList.contains("aperto")) chiudiPannello();
  else if (scelto) chiudiScheda();
});

/* ------------------------ reazioni della mappa --------------------------- */
let attesaDisegno = null;
function disegnaFraPoco() {
  clearTimeout(attesaDisegno);
  attesaDisegno = setTimeout(disegna, 90);
}
mappa.on("zoomend", disegna);
mappa.on("moveend", disegnaFraPoco);

/* --------- sospensione a scheda nascosta e ripresa al ritorno ------------ */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearTimeout(timer);
    console.info("[ciclo] scheda nascosta: aggiornamenti sospesi");
  } else {
    console.info("[ciclo] scheda di nuovo visibile: aggiornamenti ripresi");
    const vecchio = !ultimoEsito || (Date.now() - ultimoEsito) > INTERVALLO_MS;
    if (vecchio) aggiorna(true); else riprogramma();
  }
});
window.addEventListener("online", () => { fallimenti = 0; aggiorna(true); });
window.addEventListener("offline", () => segnala("guasto", "Connessione assente", "Senza rete"));

/* ------------------------------- avvio ----------------------------------- */
(async function avvio() {
  segnala("attesa", "Ricerca delle posizioni", "Ricerca");
  console.info("Autobus in tempo reale in Friuli Venezia Giulia");
  console.info("Fermate selezionate per l'interrogazione: " + FERMATE.length + " su 8506 del catalogo ufficiale");
  console.info("Soglia delle bandierine (LABEL_ZOOM): livello " + LABEL_ZOOM);
  await aggiorna(true);
  // Ogni mezzo minuto si rinfrescano le età mostrate, senza nuove richieste.
  setInterval(() => { invecchia(); disegna(); aggiornaScheda(); }, 30000);
})();
</script>
